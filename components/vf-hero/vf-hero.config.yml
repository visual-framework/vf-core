# The title shown on the component page
title: Hero
# Label shown on index pages
label: Hero
status: live
preview: "@preview--nogrid"
# The template used from /components/_previews
#
# Per-variant options
# variants:
# - name: default
#   hidden: true
context:
  component-type: container
  # Recommended responsive image settings:
  # - mobile: 360x200
  # - desktop: 1920x1080
  # - large/high-res: 2560x1440
  # vf_hero_image_mobile_src: "https://example.org/hero-mobile-360x200.jpg"
  # vf_hero_image_src: "https://example.org/hero-desktop-1920x1080.jpg"
  # vf_hero_image_large_src: "https://example.org/hero-large-2560x1440.jpg"
  # vf_hero_image_width: 1920
  # vf_hero_image_height: 1080
  # vf_hero_image_sizes: "(max-width: 767px) 100vw, 1920px"
  # vf_hero_image_fetchpriority: high
  # vf_hero_image_loading: eager



variants:
  - name: default
    context:
      vf_hero_kicker: <a href="JavaScript:Void(0);">VF Hamburg</a> | Structural Biology
      vf_hero_heading: About the Hentze group!
      vf_hero_heading_href: JavaScript:Void(0);
      vf_hero_subheading: an example of some ancillary text
      vf_hero_text:
        - The Hentze group combines biochemical and <a href="JavaScript:Void(0);">systems–level approaches</a> to investigate the connections between <a href="JavaScript:Void(0);">gene expression</a> and <a href="JavaScript:Void(0);">cell metabolism</a>, and their roles in human disease.
      vf_hero_link_text: Learn more
      vf_hero_link_href: JavaScript:Void(0);
      vf_hero_image_size: auto 28.5rem
      angular:
        <vf-hero
        [vf_hero_kicker]="'<a href=JavaScript:Void(0);>VF Hamburg</a> | Structural Biology'"
        [vf_hero_heading]="'About the Hentze group!'"
        [vf_hero_heading_href]="'JavaScript:Void(0);'"
        [vf_hero_subheading]="'an example of some ancillary text'"
        [vf_hero_text]="['The Hentze group combines biochemical and <a href=JavaScript:Void(0);>systems–level approaches</a> to investigate the connections between <a href=JavaScript:Void(0);>gene expression</a> and <a href=JavaScript:Void(0);>cell metabolism</a>, and their roles in human disease.']"
        [vf_hero_link_text]="'Learn more'"
        [vf_hero_link_href]="'JavaScript:Void(0);'"
        [vf_hero_image_size]="'auto 28.5rem'">
        </vf-hero>
      react:
        <VfHero
          id="0"
          vf_hero_kicker="<a href=JavaScript:Void(0);>VF Hamburg</a> | Structural Biology"
          vf_hero_heading="About the Hentze group!"
          vf_hero_heading_href="'JavaScript:Void(0);'"
          vf_hero_subheading="an example of some ancillary text"
          vf_hero_text={["The Hentze group combines biochemical and <a href=#>systems–level approaches</a> to investigate the connections between <a href=#>gene expression</a> and <a href=#>cell metabolism</a>, and their roles in human disease."]}
          vf_hero_link_text="Learn more"
