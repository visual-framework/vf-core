title: Chatbot
label: Chatbot
status: alpha
context:
  component-type: container
variants:
  - name: default
    hidden: true
  - name: standalone
    label: Standalone
    hidden: false
    context:
      title: "AI Assistant"
      welcome_title: "AI assistant"
      welcome_description: "Welcome! I'm here to help you."
      welcome_message: "Hello! How can I help you today?"
      input_placeholder: "Ask me ..."
      show_suggestions: true
      show_close_button: true
      ai_icon: "../../assets/vf-chatbot/assets/vf-chatbot--icon-16x16-dark-green.svg"
      welcome_logo: "../../assets/vf-chatbot/assets/vf-chatbot--icon-64x64-dark-green.svg"

  - name: modal
    label: Modal
    hidden: false
    context:
      title: title | default("Chat with us")
      welcome_message: welcome_message | default("Hello! How can I help you today?")
      input_placeholder: input_placeholder | default("Type your message...")
      show_settings: show_settings | default(true)
      ai_icon: "/assets/vf-chatbot/assets/vf-chatbot--icon-64x64-dark-green.svg"
      disclaimer: 'Disclaimer: This chatbot is designed to assist you with general information and basic inquiries. See our <a class="vf-banner__link" href="JavaScript:Void(0);">disclaimer notes</a>.'
