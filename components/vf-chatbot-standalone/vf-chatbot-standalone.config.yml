title: Chatbot Standalone
label: Chatbot Standalone
status: alpha
preview: '@preview'
context:
  component-type: container
  config:
    # Basic Configuration
    title: "AI Assistant"
    welcome_logo: true
    welcome_message: "Welcome! I'm here to help"
    welcome_logo_alt: "AI Assistant"
    welcome_suggestions_title: "Try asking me:"
    input_placeholder: "Ask me ..."
    welcome_max_suggestions: 4

    # Visual Configuration
    # theme:
    #   primary_color: "#007c82"
    #   background_color: "#f8f9fa"
    #   message_bubble_user: "#007c82"
    #   message_bubble_assistant: "#ffffff"

    # Icons and Images (all customizable)
    icons:
      assistant_avatar: "../../assets/vf-chatbot/assets/vf-chatbot--icon-16x16-dark-green.svg"
      user_avatar: "../../assets/vf-chatbot/assets/vf-chatbot--avatar-user.svg"
      send_button: "../../assets/vf-chatbot/assets/vf-chatbot--icon-send.svg"
      main_logo_url: "../../assets/vf-chatbot/assets/vf-chatbot--icon-32x32-dark-green.svg"
      thumbs_up: "../../assets/vf-chatbot/assets/vf-chatbot--icon-thumbs-up.svg"
      thumbs_down: "../../assets/vf-chatbot/assets/vf-chatbot--icon-thumbs-down.svg"

    # API Configuration
    api:
      chat_endpoint: "/api/chat"
      feedback_endpoint: "/api/feedback"
      suggestions_endpoint: "/api/suggestions"
      sources_endpoint: "/api/sources"
      headers:
        "Content-Type": "application/json"
        "Authorization": "Bearer your-token"
      timeout: 10000

    # Feature Toggles
    features:
      enable_welcome: true
      enable_feedback: true
      enable_sources: true
      enable_welcome_suggestions: true
      enable_typing_indicator: true
      enable_sound_notifications: false
      enable_conversation_history: true
      enable_file_upload: false
      enable_voice_input: false
      enable_retry: true
      enable_disclaimer: true

    # Behavior Configuration
    behavior:
      auto_scroll: true
      show_timestamps: false
      max_message_length: 1000
      typing_delay: 800
      retry_failed_messages: true
      conversation_timeout: 1800000  # 30 minutes

    # Messages and Labels (i18n ready)
    # labels:
    #   send_button_aria: "Send message"
    #   feedback_positive: "This was helpful"
    #   feedback_negative: "This was not helpful"
    #   typing_indicator: "AI is typing..."
    #   error_message: "Sorry, I could not process your request. Please try again."
    #   retry_button: "Retry"

    # Custom Event Handlers (function names)
    handlers:
      on_message_send: "handleMessageSend"
      on_response_receive: "handleResponseReceive"
      on_feedback_submit: "handleFeedbackSubmit"
      on_suggestion_click: "handleSuggestionClick"
      on_error: "handleError"
      on_conversation_start: "handleConversationStart"
      on_conversation_end: "handleConversationEnd"

    # Legacy support
    disclaimer: "Disclaimer: This chatbot is designed to assist you with general information and basic inquiries. See our <a class='vf-banner__link' target='_blank' href='https://www.ebi.ac.uk/data-protection/privacy-notice/embl-ebi-public-website/'>disclaimer notes</a>."
    footnote: "Review AI generated content for accuracy. <a class='vf-link' target='_blank' href='https://embl.service-now.com/esc?id=sc_cat_item&sys_id=5eeb8eb91b92e650b376da88b04bcbc1'>Leave feedback</a>."
