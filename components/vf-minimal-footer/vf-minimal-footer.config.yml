    context:
      footer__theme: light
      footer__logo_src: '../../assets/vf-minimal-footer/assets/embl-ebi-rgb-full-colour.svg'

  - name: Logo display
    context:
      footer__theme: dark
      footer__logo_src: '../../assets/vf-minimal-footer/assets/embl-ebi-rgb-all-white.png'
      partner__heading: 'Our partners/collaborators'
      partner__variant: logos
      partner__logos:
