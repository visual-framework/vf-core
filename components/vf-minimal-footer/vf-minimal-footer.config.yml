title: Minimal Footer
label: Minimal Footer
preview: '@preview--nogrid'
status: live
context:
  component-type: container
  footer__theme: dark
  footer__logo_src: '../../assets/vf-minimal-footer/assets/embl-ebi-rgb-all-white.png'
  footer__logo_alt: EMBL-EBI
  footer__notice: '[Name of resource] is developed and maintained by EMBL-EBI, a world leader in biological data resources.'
  footer__links:
    - text: 'Copyright © EMBL 2026'
      href: 'JavaScript:Void(0);'
    - text: 'EMBL-EBI contact'
      href: 'JavaScript:Void(0);'
    - text: 'Terms of use'
      href: 'JavaScript:Void(0);'

