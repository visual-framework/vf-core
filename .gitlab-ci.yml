# This script runs on gitlab.ebi.ac.uk
# https://gitlab.ebi.ac.uk/emblorg/vf-core-mirror
# We do it to deploy the pattern library for view
# http://www.embl.org/guidelines/visual-framework/dev-docs/
# https://dev.assets.emblstatic.net/vf/develop/
# https://dev.assets.emblstatic.net/vf/{tag}/ (eg v2.1.2 / v2.1.3-alpha.3)
# https://dev.assets.emblstatic.net/vf/{minor}/ (eg v2.1)
# https://dev.assets.emblstatic.net/vf/{major}/ (eg v2)
image: node:18.20.4

variables:
  # project specific variables can be defined here
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_DRIVER: overlay2
  GIT_STRATEGY: fetch
  CS_DOCKERFILE_PATH: $CI_PROJECT_DIR/Dockerfile
  # Dependency scanning
  DS_EXCLUDED_PATHS: ".git, vendor/bundle, node_modules"
  # SAST + IaC scanning
  SAST_EXCLUDED_PATHS: "node_modules, vendor, .git, dist, build, public/core, public/modules/contrib"
  # Clean up naming constraints by using native GitLab CI predefined variables where possible
  DOCKER_PROJECT_NAME: "${CI_PROJECT_NAME}"
  IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH:$DOCKER_PROJECT_NAME-nginx-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID"
  VM_DEV: "$EXTCORE_DEV_VMS"
  VM_PROD: "$EXTCORE_PROD_VMS"
  VM_PATH_STABLE: /var/www/drupal/stable.visual-framework.dev # tags
  VM_PATH_LATEST: /var/www/drupal/latest.visual-framework.dev # develop
  SSH_OWNER_ID: wd_drupl
  SSH_APACHE_ID: w3_wd01
  S3_BUCKET_DEV: origin.dev.vf.assets.emblstatic.net
  S3_BUCKET_PROD: origin.vf.assets.emblstatic.net
  # set secrets in Settings -> Pipelines -> Secret Variables
  SSH_OWNER_KEY: secret-key
  SSH_APACHE_KEY: secret-key
  AWS_KEY: key
  AWS_SECRET: secret-key
# Note: Security scanning jobs are defined in the included templates and extended below with specific variables and rules
include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml # Updated to the standard, stable template reference
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml

stages:
  - build
  - test
  - security-scan        # ← new: all security scanning runs here, after build
  - deploy

####################################
# GLOBAL TEMPLATE FOR WORKFLOW RULES
####################################
.security_scan_rules:
  stage: security-scan  # Forces extended jobs into your custom stage globally
  before_script: [] # CRUCIAL: Wipes out any global or inherited before_script crashes inside minimal scanner containers
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
  allow_failure: true # Optional: Don't fail the pipeline on security scan issues, but still report them

####################################
# SECURITY SCANNING OVERRIDES
####################################

# We use multi-inheritance arrays [template_job, rule_set] so we don't
# overwrite the internal script properties defined by GitLab's core templates.

# Global adjustments for included templates:
semgrep-sast:
  extends:
    - .sast-analyzer
    - .security_scan_rules

gemnasium-dependency_scanning:
  extends:
    - .ds-analyzer
    - .security_scan_rules

secret_detection:
  stage: security-scan
  before_script: [] # Keep this to preserve container stability
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'

kics-iac-sast:
  extends:
    - iac-sast
    - .security_scan_rules

# 2. Disable the default, unconfigured container scanning job to stop duplication
container_scanning:
  rules:
    - when: never

before_script:
  - echo "Loading .env file..."     # Inform about loading environment variables
  - set -a                         # Export all variables loaded from .env
  - source ./.env                  # Load environment variables from .env file
  - set +a                         # Stop exporting all variables
  - export CI_COMMIT_SHA_SHORT=${CI_COMMIT_SHA::8}    # Shorten commit SHA for tagging

nginx_container_scanning:
  extends: [container_scanning, .security_scan_rules]
  stage: security-scan
  needs: [build_dev]
  variables:
    CS_IMAGE: "$IMAGE_NGINX"
    CS_SEVERITY_THRESHOLD: "HIGH"
    CS_REGISTRY_USER: "gitlab-ci-token"
    CS_REGISTRY_PASSWORD: "$CI_JOB_TOKEN"


####################################
# BUILD
####################################

.template_build: &build
  stage: build
  tags: [dind] # Docker-in-Docker runner
  script:
    - echo "Building images with the following variables:"
    - echo "IMAGE_NGINX - $IMAGE_NGINX"
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY # Authenticate to Docker registry using token
    - docker build -t $IMAGE_NGINX --build-arg ENV=$ENVIRONMENT -f Dockerfile_nginx . # Build NGINX image
    - docker push $IMAGE_NGINX   # Push NGINX image

build_dev:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"' # Only run on dev branch
  variables:
    ENVIRONMENT: dev
  artifacts:
    paths:
      - tools/vf-core/build
      - tools/vf-component-library/build
  cache:
    paths:
      - node_modules
      - tools/vf-component-library/node_modules
  except:
    - /^.visual-framework\/.*$/
  only:
    # only match on develop branch, or specific tag patterns
    - develop
    - /^v\d+\.\d+\.\d+$/
    - /^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$/
  <<: *build

build_prod:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"' # Temporarily  run on push to master (production)
  variables:
    ENVIRONMENT: prod
  artifacts:
    paths:
      - tools/vf-core/build
      - tools/vf-component-library/build
  cache:
    paths:
      - node_modules
      - tools/vf-component-library/node_modules
  except:
    - /^.visual-framework\/.*$/
  only:
    # only match on specific tag patterns
    - /^v\d+\.\d+\.\d+$/
    - /^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$/
  <<: *build

####################################
# DEPLOY + POST-DEPLOY DRUSH
####################################
.template_deploy: &deploy
  image: ebiwd/alpine-ssh:3.20
  script:
    - mkdir -p $HOME/.kube # Prepare kube config directory
    - echo -n $KUBE_CONFIG | base64 -d > $HOME/.kube/config # Decode and write kube config
    # Dynamically set NFS server and paths based on datacenter, variables defined in Gitlab CI/CD settings
    - |
      echo "Env: $ENVIRONMENT | DC: $DATACENTER | DB DC: $DB_DATACENTER"

      ####################################
      # ENV + DC MAPPING (SINGLE SOURCE)
      ####################################
      case "$ENVIRONMENT-$DATACENTER" in

        dev-hh)
          NAMESPACE="$PROJECT_NAMESPACE_DEV"
          OVERLAY_DIR="dev"
          ;;

        prod-hh)
          NAMESPACE="$PROJECT_NAMESPACE_PROD"
          OVERLAY_DIR="prod-hh"
          ;;

        prod-hx)
          NAMESPACE="$PROJECT_NAMESPACE_PROD"
          OVERLAY_DIR="prod-hx"
          ;;

        *)
          echo "❌ Invalid combination: ENV=$ENVIRONMENT, DATACENTER=$DATACENTER"
          exit 1
          ;;
      esac

      ####################################
      # DEBUG OUTPUT (VERY USEFUL)
      ####################################
      echo "Namespace: $NAMESPACE"
      echo "Overlay: $OVERLAY_DIR"
    # Inject environment variables and prepare k8s overlays
    - cp ./.env k8s/overlays/$OVERLAY_DIR/.env # Copy .env to k8s overlay
    - mkdir -p k8s/base/config # Create config directory if it doesn't exist
    # Update Kubernetes manifests with built image tags and NFS paths
    - |
      for file in k8s/base/*.yaml; do
        sed -i \
          -e "s|{{PROJECT_NAME}}|${PROJECT_NAME}|g" \
          -e "s|{{NGINX_IMAGE}}|$IMAGE_NGINX|g" \
          "$file"
      done
    - echo "🚀 Deploying application"
    - kubectl kustomize k8s/overlays/$OVERLAY_DIR | envsubst | kubectl --namespace=$NAMESPACE apply -f - # Deploy application
    - sleep 30 # Initial wait for 30 seconds before checking rollout status

deploy_dev:
  stage: deploy
  image: ebiwd/alpine-ssh
  tags:
    - docker
  before_script:
    - add-ssh-key ${SSH_OWNER_ID} "${SSH_OWNER_KEY}" ${SSH_APACHE_ID} "${SSH_APACHE_KEY}"
    - add-search-domain ebi.ac.uk
  script:
    - for VM in ${VM_PROD}; do rsync -acv --delete-after tools/vf-component-library/build/. ${SSH_OWNER_ID}@${VM}:${VM_PATH_LATEST}/; done;
  only:
    # only match on develop branch, or specific tag patterns
    - develop
    - /^v\d+\.\d+\.\d+$/
    - /^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$/
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"' # Only run on dev branch
  variables:
    KUBE_CONFIG: $HH_EBIWD_STATIC_KUBE_CONFIG # Kube config secret for dev
    DATACENTER: hh
    ENVIRONMENT: dev
    DB_DATACENTER: ''
  needs: [build_dev]
  <<: *deploy

deploy_prod_hh:
  stage: deploy
  image: ebiwd/alpine-ssh
  tags:
    - docker
  before_script:
    - add-ssh-key ${SSH_OWNER_ID} "${SSH_OWNER_KEY}" ${SSH_APACHE_ID} "${SSH_APACHE_KEY}"
    - add-search-domain ebi.ac.uk
  script:
    - for VM in ${VM_PROD}; do rsync -acv --delete-after tools/vf-component-library/build/. ${SSH_OWNER_ID}@${VM}:${VM_PATH_STABLE}/; done;
  only:
    # only match on specific tag patterns
    - /^v\d+\.\d+\.\d+$/
    - /^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$/
  rules:
    - if: '$CI_COMMIT_TAG' # Only run on tag (production)
  variables:
    KUBE_CONFIG: $HH_EBIWD_STATIC_KUBE_CONFIG # Kube config secret for prod (hh)
    ENVIRONMENT: prod
    DATACENTER: hh
    DB_DATACENTER: pg
  needs: [build_prod]
  <<: *deploy

deploy_prod_hx:
  stage: deploy
  image: ebiwd/alpine-ssh
  tags:
    - docker
  before_script:
    - add-ssh-key ${SSH_OWNER_ID} "${SSH_OWNER_KEY}" ${SSH_APACHE_ID} "${SSH_APACHE_KEY}"
    - add-search-domain ebi.ac.uk
  script:
    - for VM in ${VM_PROD}; do rsync -acv --delete-after tools/vf-component-library/build/. ${SSH_OWNER_ID}@${VM}:${VM_PATH_STABLE}/; done;
  only:
    # only match on specific tag patterns
    - /^v\d+\.\d+\.\d+$/
    - /^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$/
  rules:
    - if: '$CI_COMMIT_TAG' # Only run on tag (production)
  variables:
    KUBE_CONFIG: $HX_EBIWD_STATIC_KUBE_CONFIG # Kube config secret for prod (hx)
    ENVIRONMENT: prod
    DATACENTER: hx
    DB_DATACENTER: fb
  needs: [build_prod]
  <<: *deploy

deploy-aws-dev:
  stage: deploy
  image: ebiwd/alpine-ssh
  tags:
    - docker
  before_script:
    - add-aws-key ${AWS_KEY} ${AWS_SECRET}
  script:
    - bin/deploy-aws
  only:
    # only match on develop branch, or specific tag patterns
    - develop
    - /^v\d+\.\d+\.\d+$/
    - /^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$/

deploy-aws-prod:
  stage: deploy
  image: ebiwd/alpine-ssh
  tags:
    - docker
  before_script:
    - add-aws-key ${AWS_KEY} ${AWS_SECRET}
  script:
    - bin/deploy-aws prod
  only:
    # only match on specific tag patterns
    - /^v\d+\.\d+\.\d+$/
    - /^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$/
